services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RXD_STORE_BACKEND: ${RXD_STORE_BACKEND:-memory}
      RXD_REDIS_URL: redis://redis:6379/0
      RXD_CORS_ORIGINS: ${RXD_CORS_ORIGINS:-*}
    depends_on:
      - redis
    restart: unless-stopped

  # Only needed when RXD_STORE_BACKEND=redis. Harmless otherwise.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
